  <path d="M96 340 Q256 400 416 340" stroke="#FF9933" stroke-width="18" fill="none"/>
  <!-- Green -->
  <path d="M96 368 Q256 428 416 368" stroke="#138808" stroke-width="18" fill="none"/>

