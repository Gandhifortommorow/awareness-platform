  <!-- Charkha (left, centered vertically) -->
  <circle cx="176" cy="240" r="64" stroke="black" stroke-width="10" fill="none"/>
  <!-- Spokes -->
  <line x1="176" y1="176" x2="176" y2="304" stroke="black" stroke-width="8"/>
  <line x1="112" y1="240" x2="240" y2="240" stroke="black" stroke-width="8"/>
  <line x1="132" y1="196" x2="220" y2="284" stroke="black" stroke-width="8"/>
  <line x1="132" y1="284" x2="220" y2="196" stroke="black" stroke-width="8"/>

  <!-- Charkha base -->
  <rect x="156" y="304" width="40" height="16" fill="black"/>
  <line x1="196" y1="312" x2="260" y2="312" stroke="black" stroke-width="6"/>

  <!-- Peace symbol (right, same vertical center) -->
  <circle cx="336" cy="240" r="64" stroke="black" stroke-width="10" fill="none"/>
  <line x1="336" y1="176" x2="336" y2="304" stroke="black" stroke-width="8"/>
